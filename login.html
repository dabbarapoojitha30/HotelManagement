<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VV Residency — Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
    url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=2070&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:400px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    color:white;
}

.login-box h2{
    text-align:center;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
}

.input-group input, .input-group select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#f4b400;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff9800;
}

.back{
    text-align:center;
    margin-top:15px;
}

.back a{
    color:white;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<h2>VV Residency — Staff Login</h2>

<div class="input-group">
    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your name">
</div>

<div class="input-group">
    <label>User Mode</label>
    <select id="role">
        <option value="manager">Manager</option>
        <option value="owner">Owner</option>
    </select>
</div>

<div class="input-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password">
</div>

<div style="text-align: right; margin-bottom: 20px; font-size: 14px;">
    <a href="forgot-password.html" style="color: white; text-decoration: none; opacity: 0.85;">Forgot Password?</a>
</div>

<button onclick="login()">Login</button>

<div class="back" style="display: flex; justify-content: space-between; margin-top: 20px;">
    <a href="landing.html">← Back</a>
    <a href="signup.html" style="color: white; text-decoration: none;">Sign Up →</a>
</div>

</div>

<script>

async function login() {

    const name = document.getElementById("name").value.trim();
    const role = document.getElementById("role").value;
    const password = document.getElementById("password").value;

    if(!name || !role || !password){
        alert("Please fill all fields");
        return;
    }

    try {

        const response = await fetch(
            "http://127.0.0.1:8001/api/auth/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    role,
                    password
                })
            }
        );

        const data = await response.json();

        if(response.ok){

            localStorage.setItem("token", data.access_token);
            localStorage.setItem("refresh_token", data.refresh_token);
            localStorage.setItem("role", data.role);
            localStorage.setItem("name", data.name);

            alert("Login Successful!");

            window.location.href = data.redirect;

        } else {

            alert(data.detail || JSON.stringify(data));

        }

    } catch(error){

        console.error(error);
        alert("Server Error");

    }
}

</script>
</body>
</html>
