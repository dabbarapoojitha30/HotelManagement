<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - VV Residency</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
    url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=2070&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}
.forgot-box{
    width:420px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    color:white;
    text-align:center;
}
.forgot-box h2{
    margin-bottom:20px;
}
.forgot-box p{
    font-size:15px;
    line-height:1.6;
    margin-bottom:30px;
    opacity:0.9;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#f4b400;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    background:#ff9800;
}
.back-link{
    margin-top:20px;
}
.back-link a{
    color:white;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>
<body>
<div class="forgot-box">
    <h2>Reset Password</h2>
    <p>For security reasons, self-service password reset is disabled. Please contact the VV Residency System Administrator or the IT department to reset your password credentials.</p>
    <button onclick="location.href='login.html'">Back to Login</button>
</div>
</body>
</html>
